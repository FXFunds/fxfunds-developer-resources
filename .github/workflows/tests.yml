name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Node.js package
        run: |
          npm ci
          npm run build

      - name: Install Python package and test tools
        run: pip install . pytest

      - name: Run tests
        run: pytest -v
